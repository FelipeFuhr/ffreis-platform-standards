pre-commit:
  commands:
    fmt-check:
      glob: "**/*.rs"
      run: make fmt-check

# Heavy whole-tree tiers — see lefthook/base.yml for the run model.
# Run via `lefthook run complex|release --all-files`.
# clippy (`make lint`) lives here, not in pre-commit: it is a full typecheck
# pass and too slow for every commit.
# All targets below are REQUIRED: adding this config to a repo's lefthook
# remotes means the repo must implement every referenced make target.
complex:
  parallel: false
  commands:
    lint:
      glob: "**/*.rs"
      run: make lint
    test:
      glob: "**/*.rs"
      run: make test
    sec:
      glob: "**/*.{rs,toml}"
      run: make sec
    coverage:
      glob: "**/*.rs"
      run: make coverage-gate
    integration-coverage:
      glob: "**/*.rs"
      run: make integration-coverage-gate

release:
  parallel: false
  commands:
    release-build:
      glob: "**/*.rs"
      run: make build-release
    mutation:
      glob: "**/*.rs"
      # DIFF-SCOPED on purpose — `make mutation-diff`, not `make mutation`.
      #
      # This tier fires on every branch whose commits imply a minor/major bump,
      # i.e. every `feat:` branch. An unscoped whole-crate sweep does not fit in
      # a promotion gate: ffreis-urbs-admin is 1,606 mutants at ~44s each, ~19
      # hours against a ~50 minute budget, so the gate was killed on every
      # `feat:` PR and none could be promoted. That is a function of crate SIZE,
      # so it reaches every Rust repo eventually.
      #
      # Scoped to the branch's own diff the same repo measured 91 mutants in
      # 41 min (79%, passing) and surfaced 12 untested mutations in the
      # branch's own new code. It is also
      # the better measure: a whole-crate score is dominated by code the PR
      # never touched, which is how a mutation gate reports a high number while
      # measuring nothing about the change under review.
      #
      # The whole-crate sweep is NOT dropped — it moves to the scheduled
      # rust-mutation.yml cron (and stays available as `make mutation` on
      # demand). See AGENTS.md "Mutation testing: PR-time vs scheduled".
      run: make mutation-diff
