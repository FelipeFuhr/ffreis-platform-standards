pre-commit:
  commands:
    yamllint:
      # Fast syntax/style pass — mirrors terraform.yml's pre-commit tflint.
      # Ansible has no dedicated file extension, so scope by the conventional
      # directory names rather than a bare *.{yml,yaml} glob (which would also
      # match workflow files, lefthook configs, k8s manifests, ...).
      glob: "{ansible,playbooks,roles}/**/*.{yml,yaml}"
      run: |
        set -eu
        command -v yamllint >/dev/null 2>&1 || { echo "skip: yamllint not installed"; exit 0; }
        yamllint .

# Heavy whole-tree tiers — see lefthook/base.yml for the run model and the
# graceful-skip contract. Run via `lefthook run complex|release --all-files`.
complex:
  parallel: false
  commands:
    lint:
      # Deeper semantic/best-practice pass (ansible-lint) — too slow for every
      # commit, same rationale as python.yml's mypy and rust.yml's clippy.
      glob: "{ansible,playbooks,roles}/**/*.{yml,yaml}"
      run: |
        set -eu
        make -n lint >/dev/null 2>&1 || { echo "skip: no 'lint' target"; exit 0; }
        make lint

release:
  parallel: false
  commands:
    # `dry-run` exercises a target inventory / needs credentials and is
    # env-sensitive — same rationale as terraform.yml's `plan`. Fully
    # delegated to the Makefile; no built-in CLI fallback since the
    # playbook/inventory selection is inherently repo-specific.
    dry-run:
      glob: "{ansible,playbooks,roles}/**/*.{yml,yaml}"
      run: |
        set -eu
        make -n dry-run >/dev/null 2>&1 || { echo "skip: no 'dry-run' target"; exit 0; }
        make dry-run
    sec:
      glob: "{ansible,playbooks,roles}/**/*.{yml,yaml}"
      run: |
        set -eu
        if make -n sec >/dev/null 2>&1; then
          make sec
        elif command -v ansible-lint >/dev/null 2>&1; then
          ansible-lint --profile production
        else
          echo "skip: no 'sec' target and ansible-lint not installed"
        fi
