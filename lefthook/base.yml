pre-commit:
  parallel: true
  commands:
    hygiene-merge-markers:
      run: |
        set -eu
        tmpfiles=$(mktemp)
        trap 'rm -f "$tmpfiles"' EXIT
        git diff --cached --name-only -z > "$tmpfiles"
        [ -s "$tmpfiles" ] || exit 0
        bad=$(xargs -0 grep -l '^<<<<<<< \|^=======$\|^>>>>>>> ' < "$tmpfiles" 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "merge markers in: $bad" >&2
          exit 1
        fi
    hygiene-large-files:
      run: |
        set -eu
        # lefthook executes inline `run:` blocks via /bin/sh, not bash, so
        # process substitution (`< <(...)`) and `read -d ''` aren't available.
        # Use a temp file fed from `git diff -z | tr` to stay POSIX.
        MAX_BYTES=$((500 * 1024))
        # Dependency lockfiles are generated source and can legitimately exceed
        # the general source-file ceiling. Retain a bounded, explicit exception
        # rather than making dependency updates uncommittable.
        MAX_LOCKFILE_BYTES=$((1024 * 1024))
        tmpfiles=$(mktemp)
        trap 'rm -f "$tmpfiles"' EXIT
        git diff --cached --name-only -z | tr '\0' '\n' > "$tmpfiles"
        [ -s "$tmpfiles" ] || exit 0
        while IFS= read -r file; do
          [ -n "$file" ] || continue
          [ -f "$file" ] || continue
          size=$(git cat-file -s ":$file" 2>/dev/null || echo 0)
          case "$file" in
            *.lock|package-lock.json)
              max_bytes=$MAX_LOCKFILE_BYTES
              ;;
            *)
              max_bytes=$MAX_BYTES
              ;;
          esac
          if [ "$size" -gt "$max_bytes" ]; then
            echo "large file ($((size / 1024)) KB): $file" >&2
            exit 1
          fi
        done < "$tmpfiles"
    hygiene-binary-files:
      run: |
        set -eu
        # See hygiene-large-files for the POSIX rationale.
        tmpfiles=$(mktemp)
        trap 'rm -f "$tmpfiles"' EXIT
        git diff --cached --name-only -z | tr '\0' '\n' > "$tmpfiles"
        [ -s "$tmpfiles" ] || exit 0
        while IFS= read -r file; do
          [ -n "$file" ] || continue
          [ -f "$file" ] || continue
          # `[ -f ]` follows a symlink to test its TARGET, but `file` (without
          # `-L`) reports on the symlink itself -- always `inode/symlink`,
          # regardless of what it points at. A symlink's own git-tracked
          # content is just a path string, never binary; skip it here rather
          # than reject every repo using symlinks to alias a shared asset
          # (e.g. several pages' identical per-page stylesheet pointing at one
          # real file) under this check meant to catch binary file CONTENT.
          [ -L "$file" ] && continue
          mime=$(file --mime-type -b "$file")
          case "$mime" in
            # `file` reports several plainly-textual formats under application/*.
            # Omitting one makes this hook reject source you must be able to commit:
            # x-ndjson blocked a .jsonl metrics series that `ws sync` rewrites on
            # every run. Listed explicitly rather than widening to application/*,
            # which would gut the check — a real binary must still fail.
            text/*|application/json|application/x-ndjson|application/xml|application/x-sh|application/javascript|application/ecmascript|application/toml|inode/x-empty) ;;
            *) echo "binary file staged: $file ($mime)" >&2; exit 1 ;;
          esac
        done < "$tmpfiles"
    pre-commit-compat:
      # Delegates to the repo's .pre-commit-config.yaml when present, so repos
      # that carry pre-commit hooks (which may cover checks not in base.yml and
      # vice-versa) run under the unified lefthook pipeline instead of needing a
      # separate `pre-commit install`. Skips gracefully when the file is absent
      # or pre-commit is not installed locally.
      # Note: run `pre-commit uninstall` in repos that previously called
      # `pre-commit install` directly, to avoid the hook firing twice.
      run: |
        set -eu
        [ -f .pre-commit-config.yaml ] || exit 0
        command -v pre-commit >/dev/null 2>&1 || { echo "skip: pre-commit not installed"; exit 0; }
        pre-commit run --hook-stage pre-commit
    secret-scan:
      # Staged-only secret scan. Prefer the repo's make target; fall back to a
      # direct gitleaks scan so repos without a Makefile (config/docs repos) still
      # get a pre-commit secret gate. Skip with a message only if neither exists.
      run: |
        set -eu
        if make -n secrets-scan-staged >/dev/null 2>&1; then
          make secrets-scan-staged
        elif command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner --redact
        else
          echo "skip: no 'secrets-scan-staged' target and gitleaks not installed"
        fi
    agents-drift-hint:
      run: |
        changed=$(git diff --cached --name-only 2>/dev/null)
        if echo "$changed" | grep -qE '\.(go|py|rs|tf)$' && \
           ! echo "$changed" | grep -q 'AGENTS\.md'; then
          echo "hint: source files changed — check if AGENTS.md needs updating" >&2
        fi
        exit 0
    actionlint-workflows:
      # Lints staged .github/workflows/*.yml/*.yaml with actionlint. Catches
      # the codeql-orphaned-SHA class of errors at commit time (see
      # project_codeql_action_orphaned_sha memory) instead of in CI minutes.
      # Skips silently when actionlint isn't installed locally.
      # --diff-filter=d excludes deleted paths: `git diff --cached --name-only`
      # lists staged deletions too, and actionlint errors trying to open a file
      # that was correctly removed (a delete-only commit would fail otherwise).
      run: |
        set -eu
        command -v actionlint >/dev/null 2>&1 || exit 0
        wf=$(git diff --cached --name-only --diff-filter=d -z \
               | tr '\0' '\n' \
               | grep -E '^\.github/workflows/.*\.(yml|yaml)$' || true)
        [ -z "$wf" ] && exit 0
        echo "$wf" | xargs -r actionlint
    ci-local-drift:
      # When workflow files change, verify every reusable-workflow they
      # reference is classified in the ci-local tool registry (the drift gate):
      # a new CI check can't silently skip running locally. Fetches the check +
      # registry from the public ffreis-platform-ci-local repo. Skips silently
      # without python3/curl or when offline (best-effort local guard; CI is the
      # authoritative gate).
      run: |
        set -eu
        wf=$(git diff --cached --name-only -z \
               | tr '\0' '\n' \
               | grep -E '^\.github/workflows/.*\.(yml|yaml)$' || true)
        [ -z "$wf" ] && exit 0
        command -v python3 >/dev/null 2>&1 || exit 0
        command -v curl >/dev/null 2>&1 || exit 0
        base="https://raw.githubusercontent.com/ffreis-org/ffreis-platform-ci-local/main/scripts"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "$base/ci-local-drift.py" -o "$tmp/d.py" 2>/dev/null \
          || { echo "ci-local drift: offline, skipping (CI will enforce)"; exit 0; }
        curl -fsSL "$base/ci-local-tools.tsv" -o "$tmp/t.tsv" 2>/dev/null || exit 0
        python3 "$tmp/d.py" --registry "$tmp/t.tsv" --workflows .github/workflows --enforce
    hadolint-dockerfiles:
      # Lints staged Dockerfile* with hadolint. Catches a dozen common
      # security/correctness issues (latest tags, apt-get without --no-install-
      # recommends, USER-less containers, ADD over COPY) before they ship.
      # Skips silently when hadolint isn't installed.
      run: |
        set -eu
        command -v hadolint >/dev/null 2>&1 || exit 0
        df=$(git diff --cached --name-only -z \
               | tr '\0' '\n' \
               | grep -E '(^|/)Dockerfile([.-].*)?$' || true)
        [ -z "$df" ] && exit 0
        echo "$df" | xargs -r hadolint
    make-inline-comments:
      # GNU make strips a trailing `# comment` from an assignment but NOT the
      # whitespace that preceded the `#`, so
      #   PLATFORM_STANDARDS_SHA := 3c787edb...8db7  # v1.2.1
      # assigns a 42-character value (40-hex SHA + two spaces). Interpolated
      # into a URL it dies with `curl: (3) URL rejected: Malformed input to a
      # URL function` — which is why `make hook-scripts` / `lefthook-install` /
      # `install-act` / `ci-local` had never worked in 146 of the 147 repos
      # carrying it. `?=` does not help; the comment must move to its own line.
      # Measured, not eyeballed — the defect is invisible in a diff.
      #
      # The auditor is NOT copied here: lefthook has already cloned this whole
      # repo at the ref the consumer pinned in its own lefthook.yml
      # (.git/info/lefthook-remotes/ffreis-platform-standards-<ref>/), so the
      # hook runs the pinned upstream script with no network call and no second
      # implementation. --git-common-dir, not --git-dir: a linked worktree's
      # gitdir has no info/ of its own. It is also resolved through `cd && pwd`
      # because git prints it RELATIVE (".git") from a normal checkout and
      # absolute only from a worktree — the one shape that matters most was the
      # one that silently found nothing.
      #
      # This is the one base.yml command whose logic is not inlined in the YAML:
      # inlining a ~200-line quote-aware awk detector here would be a second
      # implementation of the auditor, which is what the fleet's no-copy rule
      # forbids.
      run: |
        set -eu
        mk=$(git diff --cached --name-only --diff-filter=d -z \
               | tr '\0' '\n' \
               | grep -E '(^|/)(GNU)?[Mm]akefile(\.jinja|\.j2)?$|\.mk(\.jinja|\.j2)?$' || true)
        [ -z "$mk" ] && exit 0
        common=$(cd "$(git rev-parse --git-common-dir)" && pwd)
        audit=$(find "$common/info/lefthook-remotes" \
                  -maxdepth 3 -path '*ffreis-platform-standards*' \
                  -name 'audit-make-inline-comments.sh' 2>/dev/null | head -1)
        if [ -z "$audit" ]; then
          echo "make-inline-comments: auditor not in the pinned lefthook remote" >&2
          echo "  bump this repo's lefthook.yml ref to a ffreis-platform-standards" >&2
          echo "  release that ships scripts/audit-make-inline-comments.sh, or run" >&2
          echo "  'make make-comments' if this repo defines it. CI enforces it either way" >&2
          echo "  (general-make-hygiene.yml)." >&2
          exit 0
        fi
        echo "$mk" | tr '\n' '\0' | xargs -0 -r bash "$audit"

commit-msg:
  commands:
    conventional-commits:
      # The `!?` before the colon is Conventional Commits 1.0.0's breaking-change
      # marker (`feat!:`, `feat(scope)!:`). It was missing, so the one commit
      # shape that most needs to be greppable in a log — the breaking one — was
      # the only shape this hook rejected, pushing authors to the `BREAKING
      # CHANGE:` footer alone. release-please reads both, but only `!` shows up
      # in a one-line `git log --oneline`.
      #
      # Keep `pattern` in sync with lefthook/scripts/check_commit_msg.sh's
      # `pattern` (that script is distributed standalone to repos that pull it
      # directly instead of this inline command) — scripts/test-commit-msg-pattern.sh
      # extracts both this line and that script's and asserts they accept/reject
      # the same example messages, so neither file keeps its own copy of the truth.
      run: |
        set -eu
        msg=$(head -1 "{1}")
        pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|style|build|revert)(\([a-z0-9-]+\))?!?: .{1,100}$'
        # Looser than `pattern`: same type list, but any non-empty scope body
        # and no length cap. If a message matches `loose_pattern` but not
        # `pattern`, the type/shape is fine and the real problem is the scope
        # charset or the description length — say so instead of the generic
        # "non-conventional" message, which reads as a type problem.
        loose_pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|style|build|revert)(\(.+\))?!?: .*$'
        echo "$msg" | grep -qE "$pattern" || {
          echo "non-conventional commit: $msg" >&2
          if echo "$msg" | grep -qE "$loose_pattern"; then
            echo "type looks right — check: scope is lowercase/digits/hyphens only (no underscores/spaces/caps), description is 1-100 chars" >&2
          else
            echo "expected: type: description  |  type(scope): description  |  type!: description (breaking)" >&2
            echo "types: feat fix docs chore refactor test ci perf style build revert" >&2
          fi
          exit 1
        }

# ----------------------------------------------------------------------------
# COMPLEX (tier-1) — heavy, whole-tree verification. NOT a git hook stage:
# run explicitly via `lefthook run complex --all-files`, locally before a
# draft->ready promotion (/ready) and as the manual workflow_dispatch CI step.
# Language configs (go/python/rust/terraform.yml) merge their own `complex:`
# commands into this group. Commands delegate to Makefile targets and SKIP
# gracefully when the target is absent (`make -n` existence probe), so repos
# adopt incrementally without breaking the group.
# ----------------------------------------------------------------------------
complex:
  parallel: false
  commands:
    secret-scan-full:
      # Whole-tree secret scan (the pre-commit `secret-scan` is staged-only).
      run: |
        set -eu
        if make -n secrets-scan-full >/dev/null 2>&1; then
          make secrets-scan-full
        elif command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --no-banner --redact
        else
          echo "skip: no 'secrets-scan-full' target and gitleaks not installed"
        fi

# ----------------------------------------------------------------------------
# RELEASE (tier-2) — version-significant verification, run IN ADDITION to
# `complex` only when the branch's conventional commits imply a minor/major
# bump (see quality-kit/scripts/semver-bump.sh). Invoke via
# `lefthook run release --all-files`. Same run model as complex.
# ----------------------------------------------------------------------------
release:
  parallel: false
  commands:
    osv-scan:
      # Deep dependency-vulnerability scan across the whole tree.
      run: |
        set -eu
        if make -n osv-scan >/dev/null 2>&1; then
          make osv-scan
        elif command -v osv-scanner >/dev/null 2>&1; then
          osv-scanner scan --recursive .
        else
          echo "skip: no 'osv-scan' target and osv-scanner not installed"
        fi
